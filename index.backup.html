<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartCanteen</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--paper:#f6f8f7;--ink:#12201d;--teal:#0e5a52;--deep:#093d37;--mint:#dcefe9;--amber:#f2a93b;--line:#dde7e3;--mute:#5f726d;--gap:16px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;line-height:1.45}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1.2}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{from{transform:scale(.5) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}@keyframes slide{to{transform:translateX(-50%)}}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes scan{0%,100%{top:8%}50%{top:88%}}@keyframes fade{from{opacity:0}}

/* ---------- photos (replace the old emoji) ---------- */
.ph,.dish,.plate,.sat{position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#cfe8e0,#eef7f4)}
.ph img,.dish img,.plate img,.sat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ini{font:700 1.3rem 'Bricolage Grotesque',system-ui,sans-serif;color:var(--teal);letter-spacing:.06em;opacity:.8}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.hero{background:radial-gradient(circle at 50% 40%,#146b61,var(--deep) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:40px 0 0;overflow:hidden;min-width:0}
.hero h1{font-size:clamp(1.6rem,3vw,2.4rem);text-align:center;padding:0 28px;max-width:20ch}
.showcase{display:flex;flex-direction:column;align-items:center;gap:36px}
.stage{position:relative;width:340px;height:340px;margin:28px 0 0}
.stage:before{content:"";position:absolute;inset:0;border:1px dashed rgba(255,255,255,.3);border-radius:50%}
.arm{position:absolute;inset:0;animation:spin 30s linear infinite;animation-delay:var(--dl)}
.sat{position:absolute;top:-24px;left:50%;margin-left:-24px;width:48px;height:48px;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:spin 30s linear infinite reverse;animation-delay:var(--dl);border:2px solid #fff}
.plate{position:absolute;inset:60px;border-radius:50%;box-shadow:0 0 0 12px rgba(255,255,255,.12),0 24px 50px rgba(0,0,0,.35);border:4px solid #fff}
.plate .ini{font-size:3.4rem;animation:pop .6s cubic-bezier(.2,1.3,.4,1)}.plate img{animation:pop .6s}
.dn{text-align:center;min-height:60px;padding:0 20px}.dn b{display:block;font:700 1.4rem 'Bricolage Grotesque',system-ui,sans-serif}.dn small{display:block;opacity:.8;margin-top:4px}
.tick{width:100%;overflow:hidden;background:rgba(0,0,0,.2);padding:13px 0}
.tick div{display:flex;width:max-content;animation:slide 26s linear infinite;font-size:.9rem;white-space:nowrap}
.tick span{padding:0 22px;opacity:.9}.tick span+span{border-left:1px solid rgba(255,255,255,.25)}
.form{display:grid;place-content:center;padding:40px;background:#fff}.form form{width:min(360px,100%)}
.logo{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--teal),#2a9d8f);color:#fff;font:700 1.05rem 'Bricolage Grotesque',system-ui,sans-serif;margin-bottom:18px;box-shadow:0 10px 24px rgba(14,90,82,.3)}
.form h2{font-size:1.6rem}.form .sub{margin:6px 0 4px}
label{display:block;font-size:.85rem;margin:16px 0 6px;color:var(--mute)}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input,select{height:48px}input[type=file]{height:48px;padding:10px 12px}
input:focus,select:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(14,90,82,.12)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;transition:transform .15s,background .2s;line-height:1.2}
.btn:hover{background:var(--deep)}.btn:active{transform:scale(.96)}.btn:disabled{background:#b9c7c3;cursor:not-allowed}
.btn.go{height:48px;padding:0 22px}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}.btn.ghost:hover{background:var(--mint)}.btn.full{width:100%;margin-top:18px}
.hint{font-size:.8rem;color:var(--mute);margin-top:16px;line-height:1.7;padding:12px 14px;background:var(--paper);border-radius:10px}.err{color:#b3261e;font-size:.85rem;margin-top:10px;min-height:1.2em}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;align-items:start}
aside{background:var(--deep);color:#fff;padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 20px;font:700 1.15rem 'Bricolage Grotesque',system-ui,sans-serif;white-space:nowrap}
.brand .logo{flex:none;width:36px;height:36px;border-radius:10px;font-size:.85rem;margin:0;box-shadow:none;background:linear-gradient(135deg,var(--amber),#f7c873);color:var(--deep)}
aside button{background:none;border:0;color:#bcd6d0;text-align:left;padding:11px 12px;border-radius:10px;transition:all .2s;width:100%}
aside button:hover{background:rgba(255,255,255,.08);padding-left:18px}aside button.on{background:#fff;color:var(--teal);font-weight:700;padding-left:12px}
.me{margin-top:auto;padding:12px;font-size:.78rem;color:#8fb3ab;line-height:1.5;border-top:1px solid rgba(255,255,255,.12)}.me b{display:block;color:#fff;font-size:.9rem}
#out{border:1px solid rgba(255,255,255,.25);text-align:center;margin-top:6px}#out:hover{padding-left:12px}
main{padding:32px 36px 56px;max-width:1120px;width:100%;margin:0 auto;min-width:0}
.pagehead{margin-bottom:22px}.pagehead h1{font-size:1.9rem}.pagehead .sub{margin:6px 0 0}
.sub{color:var(--mute);margin:4px 0 16px}

/* ---------- cards + grids ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--gap);align-items:stretch}.grid>*{animation:rise .5s both;animation-delay:calc(var(--n,0)*70ms)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .25s,box-shadow .25s;min-width:0}
.grid>.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(14,90,82,.12)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:var(--gap);align-items:stretch}.cols h3{margin-bottom:12px}
.stat{display:flex;flex-direction:column;gap:6px}.stat b{display:block;font:700 2rem 'Bricolage Grotesque',system-ui,sans-serif;color:var(--teal);line-height:1.1}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.cardhead .sub{margin:0}

/* food cards */
.food{display:flex;flex-direction:column;gap:10px}
.food .ph{aspect-ratio:4/3;border-radius:12px}
.food .tags{display:flex;gap:6px;flex-wrap:wrap}
.food h3{font-size:1.15rem}
.facts{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}.facts b{color:var(--ink)}
.buy{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:6px}
.price{font:700 1.45rem 'Bricolage Grotesque',system-ui,sans-serif;color:var(--teal)}
.tag{display:inline-block;background:var(--mint);color:var(--teal);border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:500;line-height:1.6}.tag.am{background:#fdf0d8;color:#8a5a00}
.dish{width:76px;height:76px;border-radius:50%;flex:none;animation:bob 4s ease-in-out infinite}.dish .ini{font-size:1.1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row:first-child{padding-top:2px}
.row>span:last-child{flex:none}
.who{display:flex;align-items:center;gap:12px;min-width:0}.who .dish{width:52px;height:52px;animation:none}
.bar{height:10px;background:var(--mint);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a9d8f,var(--teal));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.pickbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.pickbar>div{flex:1;min-width:220px;max-width:420px}.pickbar label{margin-top:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px;align-items:end}.fgrid label{margin:12px 0 6px}.fgrid .wide{grid-column:span 2}.fgrid .go{align-self:end}
.stars{display:flex;gap:2px}.stars button{background:none;border:0;font-size:1.8rem;color:var(--line);transition:transform .15s;line-height:1}.stars button:hover{transform:scale(1.25)}.stars button.on{color:var(--amber)}
.chart{width:100%;height:170px;display:block}.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s ease}.draw.on{stroke-dashoffset:0}
.vb{display:flex;align-items:end;gap:8px;height:170px}
.vb div{flex:1;text-align:center;font-size:.75rem;color:var(--mute);display:flex;flex-direction:column;justify-content:end;height:100%;gap:6px}.vb i{display:block;height:0;background:var(--teal);border-radius:8px 8px 0 0;transition:height 1s cubic-bezier(.2,.8,.2,1)}

/* scanner */
.scanwrap{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:24px;align-items:start}
.scanner{position:relative;width:100%;aspect-ratio:1;border-radius:20px;background:#0b2623;overflow:hidden;margin-bottom:14px}
.scanner video{width:100%;height:100%;object-fit:cover;display:block}.scanner:after{content:"";position:absolute;left:8%;right:8%;top:8%;height:3px;background:var(--amber);box-shadow:0 0 18px var(--amber);animation:scan 2.4s ease-in-out infinite}
.scanner i{position:absolute;width:42px;height:42px;border:4px solid #fff;transition:border-color .3s}.scanner.hit i{border-color:#4ade80}
.scanner i:nth-child(2){top:14px;left:14px;border-right:0;border-bottom:0}.scanner i:nth-child(3){top:14px;right:14px;border-left:0;border-bottom:0}
.scanner i:nth-child(4){bottom:14px;left:14px;border-right:0;border-top:0}.scanner i:nth-child(5){bottom:14px;right:14px;border-left:0;border-top:0}
.demos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.demos .btn{min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center}
.nut{margin-top:var(--gap);animation:rise .5s both}.nhead{display:flex;gap:14px;align-items:center}.nhead .dish{width:64px;height:64px;animation:none}.nhead h2,.nhead h3{margin-bottom:6px}
.nbody{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:20px 0}.nbody>div:last-child{flex:1;min-width:220px}
.ring{position:relative;width:130px;height:130px;flex:none}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:700 1.6rem 'Bricolage Grotesque',system-ui,sans-serif}.ring small{font:400 .7rem 'Instrument Sans',system-ui,sans-serif;color:var(--mute)}
.mac{margin-bottom:12px;font-size:.88rem;display:grid;grid-template-columns:1fr auto;gap:0 10px}.mac .bar{grid-column:1/-1}
#qrs .card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}#qrs .q{display:grid;place-items:center;margin:6px 0}

/* payment sheet */
.ov{position:fixed;inset:0;background:rgba(9,61,55,.55);display:grid;place-items:center;z-index:20;animation:fade .2s;padding:12px}
.sheet{background:#fff;border-radius:20px;padding:22px;width:min(420px,100%);max-height:94vh;overflow:auto;animation:rise .35s}
.sheet .nhead{margin-bottom:6px}
.qty{display:flex;align-items:center;gap:12px}.qty b{min-width:1.4em;text-align:center}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.1rem}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:all .2s}.opt.on{border-color:var(--teal);background:var(--mint)}
.opt small{color:var(--mute)}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;transition:transform .35s;z-index:30;max-width:90vw;text-align:center}#toast.show{transform:translate(-50%,0)}

/* ---------- small screens ---------- */
@media(max-width:900px){.cols{grid-template-columns:1fr}.scanwrap{grid-template-columns:1fr}.scanner{max-width:360px}}
@media(max-width:760px){
 #login{grid-template-columns:1fr}.hero{padding-top:28px}.stage{transform:scale(.85);margin:10px 0 0}
 #app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;gap:6px}
 .brand,.me{display:none}aside button{white-space:nowrap;width:auto;flex:none}aside button:hover{padding-left:12px}#out{margin:0}
 main{padding:20px 16px 40px}.pagehead h1{font-size:1.6rem}.fgrid .wide{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* FORCE FIX: QR scan nutrition alignment */
#scanOut .nut {
    display: block !important;
    width: 100% !important;
    max-width: 850px !important;
    margin: 20px auto !important;
    overflow: hidden;
}

#scanOut .nbody {
    display: grid !important;
    grid-template-columns: 140px minmax(0, 1fr) !important;
    align-items: center !important;
    gap: 24px !important;
    width: 100% !important;
}

#scanOut .nbody > div:last-child {
    display: block !important;
    width: 100% !important;
    min-width: 0 !important;
}

#scanOut .mac {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) auto !important;
    align-items: center !important;
    width: 100% !important;
    margin-bottom: 14px !important;
    gap: 6px 12px !important;
}

#scanOut .mac .bar {
    grid-column: 1 / -1 !important;
    display: block !important;
    width: 100% !important;
    height: 10px !important;
    overflow: hidden !important;
    margin-top: 0 !important;
}

#scanOut .mac .bar i {
    display: block !important;
    height: 100% !important;
    max-width: 100% !important;
    transition: width 1s ease !important;
}

#scanOut .nhead .dish {
    flex-shrink: 0;
}

#scanOut .nut > .sub {
    overflow-wrap: anywhere;
}

@media (max-width: 520px) {
    #scanOut .nbody {
        grid-template-columns: minmax(0, 1fr) !important;
    }
}
</style>
</head>
<body>
<section id="login">
  <div class="hero">
    <h1>Today's menu, fresh from the kitchen</h1>
    <div class="showcase"><div class="stage" id="stage"><div class="plate" id="plate"></div></div><div class="dn" id="dn"></div></div>
    <div class="tick"><div id="tk"></div></div>
  </div>
  <div class="form">
    <form id="lf">
      <div class="logo">SC</div>
      <h2>Sign in to SmartCanteen</h2>
      <p class="sub">Order, pay and track your food.</p>
      <label for="em">College email</label><input id="em" type="email" required autocomplete="username">
      <label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
      <div class="err" id="le" role="alert"></div>
      <button class="btn full" style="margin-top:6px">Sign in</button>
      <p class="hint"><b>Student:</b> student@canteen.edu / student123<br><b>Admin:</b> admin@canteen.edu / admin123</p>
    </form>
  </div>
</section>
<div id="app" class="hide"><aside><div class="brand"><span class="logo">SC</span>SmartCanteen</div><nav id="nav" style="display:contents"></nav><div class="me" id="me"></div><button id="out">Sign out</button></aside><main id="main"></main></div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupee=n=>'₹'+Number(n).toLocaleString('en-IN');
const ini=n=>String(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
/* food photo; initials show only until a photo exists */
const pic=i=>`<span class="ini">${esc(ini(i.name))}</span>`+(i.image?`<img src="${esc(i.image)}" alt="${esc(i.name||'')}" onerror="this.remove()">`:'');
const S={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}},clear:()=>{try{sessionStorage.clear()}catch{}}};
let T=S.get('t'),U=JSON.parse(S.get('u')||'null'),LIVE=null;

/* demo data, used only when the Flask server is not running */
const DB={menu:[[1,'Misal Pav','Breakfast',50,80,420,14,58,15,9,'Sprouted moth beans, spicy curry, farsan, pav',83],[2,'Vada Pav','Snacks',25,60,290,7,41,11,3,'Potato fritter, pav, garlic chutney',72],[3,'Poha','Breakfast',30,50,250,6,42,6,3,'Flattened rice, peanuts, onion, turmeric',47],[4,'Veg Biryani','Lunch',90,40,450,10,70,13,4,'Basmati rice, vegetables, saffron, spices',58],[5,'Masala Dosa','Lunch',60,40,380,8,55,14,4,'Rice-lentil batter, spiced potato, chutney',50],[6,'Dal Tadka Rice','Lunch',70,40,390,13,62,8,7,'Toor dal, rice, ghee tadka, cumin',62]].map(([id,name,category,price,stock,cal,protein,carbs,fat,fiber,ingredients,pred])=>({id,name,category,price,stock,cal,protein,carbs,fat,fiber,ingredients,pred,image:'/img/'+name.toLowerCase().replace(/ /g,'-')+'.jpg'})),orders:[{id:100,name:'Veg Biryani',item:'Veg Biryani',student:'Aman',qty:1,total:90,created:'2026-10-02T12:10:00',method:'cash',status:'unpaid',txn:''}],ratings:[{item_id:1,stars:5,comment:'Very tasty',student:'Shweta',created:''},{item_id:4,stars:4,comment:'Needs more raita',student:'Aman',created:''}],nid:7,oid:101};
const tot=()=>DB.menu.reduce((a,i)=>a+i.pred,0);
async function mock(p,o){
 const b=o.body||{},m=o.method||'GET';await new Promise(r=>setTimeout(r,120));
 if(p==='/login'){const a=b.email==='admin@canteen.edu'&&b.password==='admin123',s=b.email==='student@canteen.edu'&&b.password==='student123';if(!a&&!s)throw new Error('Wrong email or password.');return{token:'x',user:{id:a?1:2,name:a?'Canteen Admin':'Shweta',role:a?'admin':'student'}}}
 if(p==='/menu'&&m==='GET')return DB.menu.map(i=>{const r=DB.ratings.filter(x=>x.item_id==i.id);return{...i,rating:r.length?+(r.reduce((a,x)=>a+x.stars,0)/r.length).toFixed(1):null}});
 if(p==='/menu'&&m==='POST'){if(!b.name||b.price==='')throw new Error('Enter a name, a price and a stock number.');DB.menu.push({id:DB.nid++,name:b.name,category:b.category,price:+b.price,stock:+b.stock,cal:+b.cal||0,protein:+b.protein||0,carbs:+b.carbs||0,fat:+b.fat||0,fiber:0,ingredients:'',pred:30,image:''});return{ok:1}}
 if(p==='/public/menu')return DB.menu;
 if(p==='/admin/orders')return DB.orders;
 if(/^\/admin\/orders\/\d+\/paid$/.test(p)){DB.orders.find(x=>x.id==p.split('/')[3]).status='paid';return{ok:1}}
 if(/^\/menu\/\d+\/image$/.test(p)){DB.menu.find(x=>x.id==p.split('/')[2]).image=b.data;return{ok:1}}
 if(p.startsWith('/menu/')){DB.menu=DB.menu.filter(i=>i.id!=p.split('/')[2]);return{ok:1}}
 if(p==='/orders'&&m==='POST'){const i=DB.menu.find(x=>x.id==b.item_id),q=+b.qty||1;if(i.stock<q)throw new Error('Only '+i.stock+' left of '+i.name+'.');if(b.method!=='cash'&&b.method!=='phonepe')throw new Error('Choose a payment method.');i.stock-=q;const id=DB.oid++,pp=b.method==='phonepe',status=pp?'pending':'unpaid';DB.orders.unshift({id,name:i.name,item:i.name,student:'Shweta',qty:q,total:q*i.price,created:new Date().toISOString().slice(0,19),method:b.method,status,txn:''});const r={ok:1,id,total:q*i.price,status,txn:''};if(pp)r.pay={vpa:'yourname@ybl',name:'SmartCanteen',note:'SmartCanteen order '+id};return r}
 if(/^\/orders\/\d+\/confirm$/.test(p)){const o=DB.orders.find(x=>x.id==p.split('/')[2]),u=String(b.utr||'').replace(/\s/g,'');if(!/^\d{12}$/.test(u))throw new Error('Enter the 12-digit UTR (reference number) shown in PhonePe.');o.status='paid';o.txn=u;return{ok:1,id:o.id,total:o.total,status:'paid',txn:u}}

 return `<div class="card">`+(f.length?f.map(x=>`<div class="row"><span><b>${esc(x.item)}</b> · <span style="color:var(--amber)">${'★'.repeat(x.stars)}</span><br><small class="sub" style="margin:0">${esc(x.student)}: ${esc(x.comment||'No comment')}</small></span></div>`).join(''):'<p class="sub" style="margin:0">No feedback yet. Student ratings appear here.</p>')+'</div>'}

/* payment: Cash or PhonePe (matches app.py) */
const stag=x=>{const s=x.status,l={paid:x.method==='cash'?'Paid · Cash':'Paid · PhonePe',unpaid:'Pay at counter',pending:'Awaiting payment',cancelled:'Cancelled'}[s]||s;return `<span class="tag ${s==='paid'?'':'am'}">${esc(l)}</span>`};
function openPay(id){
 const i=MENU.find(x=>x.id==id);if(!i)return;let q=1,meth='cash';
 const o=document.createElement('div');o.className='ov';document.body.appendChild(o);const close=()=>o.remove();o.onclick=e=>{if(e.target===o)close()};
 const done=r=>{o.innerHTML=`<div class="sheet" style="text-align:center"><svg width="90" height="90" viewBox="0 0 90 90"><circle class="draw" pathLength="1" cx="45" cy="45" r="40" fill="none" stroke="#0e5a52" stroke-width="5"/><path class="draw" pathLength="1" d="M27 46l12 12 24-26" fill="none" stroke="#0e5a52" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h2>Order placed</h2><p class="sub">Token <b style="color:var(--teal);font-size:1.5rem">#${r.id}</b><br>${meth==='phonepe'?`Paid ${rupee(r.total)} via PhonePe · ${esc(r.txn)}`:`Pay ${rupee(r.total)} in cash at the counter`}</p><button class="btn full" id="dn2">View my orders</button></div>`;
  play();$('#dn2').onclick=()=>{close();go('orders')}};
 const wait=r=>{const p=r.pay,qs=`pa=${encodeURIComponent(p.vpa)}&pn=${encodeURIComponent(p.name)}&am=${r.total}&cu=INR&tn=${encodeURIComponent(p.note)}&tr=SC${r.id}`,link='phonepe://pay?'+qs;
  o.innerHTML=`<div class="sheet" style="text-align:center"><h3>Pay ${rupee(r.total)} in PhonePe</h3><p class="sub">PhonePe opens on your phone. After paying, come back here and enter the 12-digit UTR (reference number) shown in PhonePe.</p><a class="btn full" style="display:block;text-decoration:none" href="${esc(link)}">Open PhonePe</a><div id="uq" style="display:grid;place-items:center;margin:14px 0 4px"></div><p class="sub" style="margin:0 0 6px;font-size:.8rem">On a computer, scan this QR with PhonePe.</p><label for="utr" style="text-align:left">UTR / reference number</label><input id="utr" inputmode="numeric" maxlength="12" placeholder="12 digits"><div class="err" id="pe" role="alert"></div><button class="btn full" id="ok" style="margin-top:6px">I have paid</button><button class="btn ghost full" id="cn" style="margin-top:8px">Cancel order</button></div>`;
  if(window.QRCode)new QRCode($('#uq'),{text:'upi://pay?'+qs,width:130,height:130,colorDark:'#0e5a52'});
  if(/Android|iPhone|iPad/i.test(navigator.userAgent))setTimeout(()=>{location.href=link},300);
  $('#ok').onclick=async()=>{try{done(await api('/orders/'+r.id+'/confirm',{method:'POST',body:{utr:$('#utr').value}}))}catch(x){$('#pe').textContent=x.message}};
  $('#cn').onclick=async()=>{try{await api('/orders/'+r.id+'/cancel',{method:'POST'})}catch{}close();toast('Order cancelled')}};
 const draw=()=>{const lbl=meth==='cash'?'Place order':'Pay '+rupee(i.price*q)+' with PhonePe';
  o.innerHTML=`<div class="sheet" role="dialog" aria-label="Payment"><div class="nhead"><div class="dish" style="width:56px;height:56px;animation:none">${pic(i)}</div><div><h3>${esc(i.name)}</h3><span class="sub" style="margin:0">${rupee(i.price)} each</span></div></div>
  <div class="row"><span>Quantity</span><span class="qty"><button id="qm" aria-label="Fewer">−</button><b>${q}</b><button id="qp" aria-label="More">+</button></span></div>
  <div class="row"><span>Total</span><b style="font-size:1.3rem;color:var(--teal)">${rupee(i.price*q)}</b></div>
  <p class="sub" style="margin:14px 0 0">Payment method</p>
  <button class="opt ${meth==='cash'?'on':''}" data-m="cash"><span style="font-size:1.6rem">💵</span><span><b>Cash</b><br><small>Pay at the counter when you collect</small></span></button>
  <button class="opt ${meth==='phonepe'?'on':''}" data-m="phonepe"><span style="font-size:1.6rem">📱</span><span><b>PhonePe</b><br><small>PhonePe opens so you can pay now</small></span></button>
  <div class="err" id="pe" role="alert"></div><button class="btn full" id="go" style="margin-top:6px">${lbl}</button><button class="btn ghost full" id="cl" style="margin-top:8px">Cancel</button></div>`;
  $('#qm').onclick=()=>{q=Math.max(1,q-1);draw()};$('#qp').onclick=()=>{q=Math.min(10,q+1);draw()};
  o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{meth=b.dataset.m;draw()});
  $('#cl').onclick=close;
  $('#go').onclick=async()=>{const b=$('#go');b.disabled=true;b.textContent=meth==='phonepe'?'Opening PhonePe…':'Placing order…';
   try{const r=await api('/orders',{method:'POST',body:{item_id:i.id,qty:q,method:meth}});meth==='phonepe'?wait(r):done(r)}
   catch(x){$('#pe').textContent=x.message;b.disabled=false;b.textContent=lbl}};
 };
 draw();
}
async function vOrd(){
 const o=await api('/admin/orders');
 window.markPaid=async id=>{await api('/admin/orders/'+id+'/paid',{method:'POST'});toast('Marked as paid');go('ord')};
 return `<div class="card">`+(o.length?o.map(x=>`<div class="row"><span><b>#${x.id} ${esc(x.item)}</b> × ${x.qty}<br><small class="sub" style="margin:0">${esc(x.student)} · ${rupee(x.total)} · ${x.method==='cash'?'Cash':'PhonePe '+esc(x.txn)}</small></span>${x.status==='unpaid'?`<button class="btn" onclick="markPaid(${x.id})">Mark paid</button>`:stag(x)}</div>`).join(''):'<p class="sub" style="margin:0">No orders yet.</p>')+'</div>'}
if(T&&U)start();
</script>
</body>
</html>
